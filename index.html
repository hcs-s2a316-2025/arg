<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>チャット</title>
  <meta name="theme-color" content="#06c755">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-title">
        <span class="name">ボット</span>
        <span id="status" class="badge">確認中…</span>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="small" hidden>追加</button>
        <button id="clearBtn" class="small" title="履歴を消す">消去</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="iosBanner" class="ios-banner" hidden>
      <div class="ios-text">
        <strong>ホーム画面に追加</strong>すると、アプリのように使えます。<br>
        下の共有ボタン <span class="share-icon" aria-hidden="true">⎋</span> を押して、<b>「ホーム画面に追加」</b>を選んでください。
      </div>
      <button id="iosClose" class="ios-close" aria-label="閉じる">×</button>
    </div>

    <form id="form" class="composer" autocomplete="off">
      <input id="input" type="text" placeholder="メッセージを入力" enterkeyhint="send" maxlength="500">
      <button id="send" type="submit" disabled aria-label="送信">送信</button>
    </form>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
